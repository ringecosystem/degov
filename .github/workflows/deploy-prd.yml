name: Deploy production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Vercel root directory
        run: |
          mkdir -p packages
          rm -rf packages/web
          cp -a apps/web packages/web
          node - <<'NODE'
          const fs = require("fs");
          const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const webPkg = JSON.parse(fs.readFileSync("packages/web/package.json", "utf8"));
          webPkg.packageManager = rootPkg.packageManager;
          webPkg.pnpm = rootPkg.pnpm;
          fs.writeFileSync("packages/web/package.json", `${JSON.stringify(webPkg, null, 2)}\n`);
          NODE
          cp -a apps/web/. .
          cp packages/web/package.json package.json
          rm -f pnpm-workspace.yaml
          cat > vercel.json <<'EOF'
          {
            "installCommand": "pnpm install --no-frozen-lockfile",
            "buildCommand": "pnpm build:vercel",
            "env": {
              "DEGOV_PUBLIC_SITE_URL": "https://demo.degov.ai"
            }
          }
          EOF

      - uses: darwinia-network/devops/actions/smart-vercel@main
        name: Deploy degov
        with:
          node_version: 22
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_group: itering
          preview_output: true
          prod_mode: true
          project_name: "degov"
          script_run: false
          dist_path: .
          enable_notify_slack: false
          slack_channel: public-degov
          slack_webhook: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
